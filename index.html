<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>BanTV Drop</title>
<style>
:root{--bg:#0a0e13;--p1:#10161d;--p2:#151d26;--ln:#22303d;--tx:#eaf1f7;--mut:#8fa0af;
--mint:#2de0b0;--blue:#6ea8fe;--yel:#ffd166;--red:#ff4d5e;--nav:#0c1117;--dark:#12141c}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;
background:radial-gradient(600px 340px at 12% -6%,rgba(45,224,176,.09),transparent 60%),
radial-gradient(700px 400px at 92% 4%,rgba(139,124,246,.10),transparent 60%),
radial-gradient(900px 500px at 50% 110%,rgba(110,168,254,.07),transparent 60%)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--tx)}
.hidden{display:none!important}
.mut{color:var(--mut)}.sm{font-size:12.5px}
#errbar{position:fixed;top:0;left:0;right:0;z-index:200;background:var(--red);color:#fff;padding:8px 12px;font:12px ui-monospace,monospace;white-space:pre-wrap}
#tb{height:42px;display:flex;align-items:center;gap:10px;padding:0 12px;background:rgba(10,14,19,.96);border-bottom:1px solid var(--ln);position:sticky;top:0;z-index:30;backdrop-filter:blur(14px)}
#tb .logo{font-weight:800;font-size:12px;letter-spacing:.14em;color:var(--mut);white-space:nowrap}
#tb .logo b{color:var(--mint)}
.tb-drag{flex:1;height:100%;display:flex;align-items:center;justify-content:center;gap:8px;user-select:none}
.tb-drag .dot{width:7px;height:7px;border-radius:50%;background:var(--mint);box-shadow:0 0 10px var(--mint);animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.4}}
.tb-drag .url{font:11px ui-monospace,monospace;color:var(--mut);cursor:pointer;padding:4px 8px;border-radius:8px}
.tb-drag .url:hover{background:var(--p2);color:var(--tx)}
.wbtn{width:34px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--mut);transition:.15s}
.wbtn:hover{background:var(--p2);color:var(--tx)}
.wbtn.close:hover{background:var(--red);color:#fff}
.wbtn svg{width:14px;height:14px}
body:not(.has-py) .wbtn{display:none}
header{position:sticky;top:42px;z-index:25;display:flex;align-items:center;gap:12px;padding:10px 18px;background:rgba(10,14,19,.96);border-bottom:1px solid var(--ln);backdrop-filter:blur(14px)}
.spacer{flex:1}
.chip{font:11px ui-monospace,monospace;color:var(--mint);background:rgba(45,224,176,.1);border:1px solid rgba(45,224,176,.3);border-radius:20px;padding:4px 10px}
.swrap{position:relative;width:46px;height:42px;flex:none}
.search{position:absolute;right:0;top:0;width:46px;height:42px;background:var(--dark);border:1px solid var(--ln);border-radius:50px;display:flex;align-items:center;padding:0 12px;cursor:pointer;z-index:26;transition:width .7s cubic-bezier(.8,-.4,.2,1.4)}
.search.open{width:min(380px,86vw)}
.search-results{position:absolute;right:0;top:48px;width:min(380px,86vw);max-height:330px;overflow:auto;background:var(--p1);border:1px solid var(--ln);border-radius:14px;box-shadow:0 18px 36px rgba(0,0,0,.35);padding:6px;display:none}
.search-results.open{display:block}.sres{width:100%;padding:10px;border-radius:10px;text-align:left;color:var(--tx)}.sres:hover,.sres:focus{background:var(--p2);outline:0}.sres b{display:block;font-size:13px}.sres span{display:block;color:var(--mut);font-size:11px;margin-top:2px}
.search svg{width:18px;height:18px;stroke:var(--mut);flex:none;transition:.2s}
.search.open svg{stroke:var(--mint)}
.search input{flex:1;width:0;background:none;border:0;outline:0;opacity:0;padding:0 8px;transition:opacity .3s .15s}
.search.open input{opacity:1;width:auto}
.search .clr{color:var(--mut);font-size:17px;opacity:0;pointer-events:none}
.search.open .clr{opacity:1;pointer-events:auto}
main{max-width:1080px;margin:0 auto;padding:20px 16px 180px}
#activeSends{max-width:1080px;margin:0 auto;padding:0 16px 180px}
#view > *{transition:filter .35s,opacity .35s}
body.spotting #view > *:not(.spot){filter:blur(6px);opacity:.4}
body.spotting #view > .spot{filter:none;opacity:1;position:relative;z-index:6;background:var(--p1);
border-radius:18px;box-shadow:0 0 0 3px var(--mint),0 0 46px rgba(45,224,176,.4);animation:spotin .45s cubic-bezier(.3,1.3,.5,1)}
@keyframes spotin{from{transform:scale(.96)}to{transform:scale(1)}}
h1{font-size:26px;margin:4px 0 16px;background:linear-gradient(90deg,#fff,#9fb6c9);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.card{background:linear-gradient(180deg,var(--p1),rgba(16,22,29,.6));border:1px solid var(--ln);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
#view.anim .card{animation:cin .4s cubic-bezier(.3,1.2,.5,1)}
@keyframes cin{from{opacity:0;transform:translateY(14px)}}
.card h3{font-size:15px;margin-bottom:4px}
.card .sub{color:var(--mut);font-size:12.5px;margin-bottom:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--p2);border:1px solid var(--ln);border-radius:12px;padding:10px 16px;font-weight:600;transition:transform .15s,box-shadow .2s}
.btn:active{transform:scale(.95)}
.btn.mint{background:rgba(45,224,176,.12);border-color:rgba(45,224,176,.45);color:var(--mint)}
.btn.red{background:rgba(255,77,94,.1);border-color:rgba(255,77,94,.4);color:var(--red)}
.btn.sm{padding:7px 12px;border-radius:10px;font-size:13px}
.btn[disabled]{opacity:.45;pointer-events:none}
select,.tin,textarea.tin{background:var(--p2);border:1px solid var(--ln);border-radius:10px;padding:9px 12px;outline:0;max-width:100%}
textarea.tin{width:100%;min-height:90px;resize:vertical}
@media(max-width:640px){select{flex:1}}
code.addr{font:12px ui-monospace,monospace;color:var(--blue);word-break:break-all}
.bigcode{font:700 30px ui-monospace,monospace;color:var(--mint);letter-spacing:.12em;text-shadow:0 0 18px rgba(45,224,176,.5)}
.stchip{display:inline-block;font-size:11px;font-weight:700;border-radius:8px;padding:3px 8px}
.stchip.off{background:rgba(255,209,102,.15);color:var(--yel)}
.stchip.tr{background:rgba(110,168,254,.15);color:var(--blue)}
.stchip.ok{background:rgba(45,224,176,.15);color:var(--mint)}
.stchip.bad{background:rgba(255,77,94,.15);color:var(--red)}
.pbar{height:6px;border-radius:6px;background:var(--ln);overflow:hidden;margin-top:8px}
.pbar i{display:block;height:100%;width:0;background:var(--mint);box-shadow:0 0 12px var(--mint);transition:width .3s}
.frow.reqhl{border-color:rgba(255,209,102,.65);animation:reqp 1.8s infinite}
@keyframes reqp{0%,100%{box-shadow:0 0 0 0 rgba(255,209,102,0)}50%{box-shadow:0 0 18px 2px rgba(255,209,102,.35)}}
.dz{border:1.5px dashed var(--ln);border-radius:16px;padding:18px;display:flex;gap:14px;align-items:center;cursor:pointer;transition:border-color .2s,background .2s,transform .15s}
.dz.over{border-color:var(--mint);background:rgba(45,224,176,.06);transform:scale(1.01)}
.dz .ic{width:46px;height:46px;border-radius:12px;background:rgba(110,168,254,.14);display:grid;place-items:center;flex:none}
.dz .ic svg{width:22px;height:22px;stroke:var(--blue)}
.frow{display:flex;align-items:center;gap:12px;background:var(--p2);border:1px solid var(--ln);border-radius:14px;padding:10px 12px;margin-top:10px;position:relative;--p:0;transition:border-color .3s,background .3s}
.frow.done{border-color:rgba(45,224,176,.45);background:rgba(45,224,176,.05)}
.frow.fail{border-color:rgba(255,77,94,.55);background:rgba(255,77,94,.06)}
.thumb{width:52px;height:52px;border-radius:12px;overflow:hidden;position:relative;flex:none;background:#0a0d12;display:grid;place-items:center;border:1.5px solid var(--ln)}
.thumb .ghost,.thumb .live{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb .ghost{filter:grayscale(1) brightness(.32)}
.thumb .live{clip-path:inset(0 0 calc((1 - var(--p)) * 100%) 0)}
.thumb .fic{font-size:10px;color:var(--mut);font-weight:700}
.thumb .ring{position:absolute;inset:-1.5px;border-radius:12px;background:conic-gradient(var(--blue) calc(var(--p)*1turn),transparent 0);
-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px))}
.okb{position:absolute;left:40px;top:44px;width:20px;height:20px;border-radius:50%;background:var(--mint);display:grid;place-items:center;animation:pop .35s cubic-bezier(.5,1.8,.5,1);z-index:2}
.okb svg{width:11px;height:11px;stroke:#04241b;stroke-width:3}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.fmeta{flex:1;min-width:0}
.fmeta .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fmeta .s{font-size:12px;color:var(--mut)}
.frow.done .fmeta .s{color:var(--mint)}.frow.fail .fmeta .s{color:var(--red)}
.ck{width:24px;height:24px;border-radius:8px;border:1.5px solid var(--ln);background:var(--p2);display:grid;place-items:center;flex:none;cursor:pointer;transition:.15s}
.ck.on{background:var(--mint);border-color:var(--mint)}
.ck svg{width:13px;height:13px;stroke:#04241b;stroke-width:3;opacity:0}
.ck.on svg{opacity:1}
.drop{position:relative;padding:30px 0 6px;text-align:center}
.drop .rig{position:absolute;left:50%;top:0;animation:fall 2.4s ease-in-out infinite}
.drop .rig svg{width:58px;height:58px;animation:sway 2.4s ease-in-out infinite;filter:drop-shadow(0 0 10px rgba(45,224,176,.4))}
@keyframes fall{0%,100%{transform:translate(-50%,-8px)}55%{transform:translate(-50%,10px)}}
@keyframes sway{0%,100%{rotate:-4deg}50%{rotate:4deg}}
.drop .track{height:4px;border-radius:4px;background:var(--ln);overflow:hidden;margin:36px auto 10px;max-width:440px}
.drop .track i{display:block;height:100%;width:0;background:var(--mint);box-shadow:0 0 16px var(--mint);transition:width .25s}
.drop .pct{color:var(--mut);font-family:ui-monospace,monospace}
.drop .chk{width:54px;height:54px;margin:4px auto;stroke:var(--mint);stroke-width:3;fill:none;filter:drop-shadow(0 0 10px rgba(45,224,176,.7))}
.drop .chk path{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .6s .1s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.waitring{width:54px;height:54px;margin:8px auto;border-radius:50%;border:3px solid var(--ln);border-top-color:var(--yel);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(1turn)}}
#sendfx{position:fixed;inset:0;z-index:95;pointer-events:none;
background:rgba(5,8,11,.5);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#sendfx .fxx{pointer-events:auto;position:absolute;top:14px;right:14px;height:40px;padding:0 16px;border-radius:12px;
background:var(--p2);border:1px solid var(--ln);color:var(--mut);font-size:13px;font-weight:600;
display:flex;align-items:center;gap:8px;z-index:5;transition:.15s}
#sendfx .fxx:hover{color:var(--tx);background:var(--p1)}
.fxstage{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:flex-start;padding:12vh 7vw 0}
.dev{width:130px;text-align:center;color:var(--mut);position:relative}
.dev svg{width:76px;height:76px}
.devname{margin-top:6px;font-size:12px;font-weight:600}
.tray{height:24px;display:flex;gap:4px;justify-content:center;align-items:flex-end;margin-top:8px}
.tray i{width:14px;height:14px;border-radius:4px;background:var(--mint);opacity:0;transform:scale(0)}
.tray i.in{animation:pop .4s forwards}
.tray i.pk{background:var(--blue)}
.wave{position:absolute;left:50%;top:38%;width:14px;height:14px;border:2px solid var(--mint);border-radius:50%;
transform:translate(-50%,-50%);opacity:0;pointer-events:none}
.wave.go{animation:wv 1s ease-out 2}
@keyframes wv{from{opacity:.8;width:14px;height:14px}to{opacity:0;width:110px;height:110px}}
.netline{position:absolute;left:13vw;right:13vw;top:60%;height:2px;background:var(--ln)}
.netline .pulse{position:absolute;inset:0;
background:repeating-linear-gradient(90deg,transparent 0 14px,rgba(45,224,176,.28) 14px 28px);
animation:netflow 1s linear infinite}
@keyframes netflow{to{background-position:28px 0}}
.node{position:absolute;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:var(--ln);transition:.25s}
.node.on{background:var(--mint);box-shadow:0 0 12px var(--mint)}
.netpkt{position:absolute;top:50%;left:0;transform:translate(-50%,-50%);will-change:left;transition:opacity .4s}
.netpkt::after{content:"";position:absolute;right:100%;top:50%;width:70px;height:2px;transform:translateY(-50%);
background:linear-gradient(90deg,transparent,var(--mint))}
.netpkt .bx{width:36px;height:32px;border-radius:9px;background:#151d26;border:2px solid var(--mint);
box-shadow:0 0 20px rgba(45,224,176,.55);display:grid;place-items:center;color:var(--mint);font-weight:700;font-size:12px}
.fxchk{position:absolute;right:13vw;top:calc(60% - 96px);transform:translateX(50%)}
.fxchk svg{width:64px;height:64px;stroke:var(--mint);stroke-width:3;fill:none;filter:drop-shadow(0 0 16px rgba(45,224,176,.7))}
.fxchk path{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .6s .1s forwards}
.fxlabel{position:absolute;left:0;right:0;top:calc(60% + 46px);text-align:center;color:var(--mut);font-weight:600;letter-spacing:.06em}
.modal.wide{width:min(660px,96vw)}
.deckwrap{overflow:hidden;padding:36px 8px 22px}
.deck{display:flex;justify-content:center;align-items:flex-end;position:relative}
.slot{width:72px;height:100px;margin:0 5px;transform-origin:50% 320%;position:relative}
.slot .cd{position:absolute;inset:0;border-radius:14px;background:linear-gradient(180deg,#1b2334,#161d2b);border:1.5px solid #35435f;display:grid;place-items:center;font:700 30px ui-monospace,monospace;color:#dfe8ff;box-shadow:0 14px 28px rgba(0,0,0,.5);transition:border-color .4s,box-shadow .4s}
.slot .cd span{transition:opacity .35s,color .3s,text-shadow .3s}
.slot.cur .cd{border-color:var(--blue);box-shadow:0 0 0 3px rgba(110,168,254,.25)}
.slot .cd svg{position:absolute;inset:-1.5px;width:calc(100% + 3px);height:calc(100% + 3px)}
.slot .cd svg rect{fill:none;stroke:var(--mint);stroke-width:2;stroke-dasharray:1;stroke-dashoffset:1}
.deck.okk .cd{border-color:var(--mint);box-shadow:0 0 26px rgba(45,224,176,.5),0 14px 28px rgba(0,0,0,.5)}
.deck.okk .cd span{opacity:0}
.deck .pilechk{position:absolute;left:50%;top:50%;width:46px;height:46px;transform:translate(-50%,-50%);
stroke:var(--mint);stroke-width:3;fill:none;z-index:6;filter:drop-shadow(0 0 12px rgba(45,224,176,.75))}
.deck .pilechk path{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .55s .2s forwards}
.deck.err .cd{border-color:var(--red);animation:shake .4s}
@keyframes shake{0%,100%{translate:0}25%{translate:-7px}75%{translate:7px}}
@media(max-width:520px){.slot{width:56px;height:80px;margin:0 4px}.slot .cd{font-size:24px;border-radius:12px}}
.modal.ok h3{color:var(--mint)}
.mback{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);z-index:50;display:grid;place-items:center;animation:fin .2s}
@keyframes fin{from{opacity:0}}
.modal{width:min(560px,94vw);max-height:88vh;overflow:auto;background:var(--p1);border:1px solid var(--ln);border-radius:24px;padding:24px;animation:mup .4s cubic-bezier(.3,1.3,.5,1)}
.modal h3{font-size:19px}
@keyframes mup{from{transform:translateY(46px) scale(.97);opacity:0}}
@media(max-width:640px){.mback{place-items:end center}.modal{width:100vw;border-radius:24px 24px 0 0;padding:18px}.modal.wide{width:100vw}}
.bnav{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(620px,calc(100% - 28px));height:70px;background:var(--nav);border-radius:10px;display:flex;z-index:40;box-shadow:0 15px 25px rgba(0,0,0,.35);--ai:0}
.bnav button{flex:1;position:relative;color:#fff;display:grid;place-items:center;height:100%}
.bnav button svg{width:24px;height:24px;transition:opacity .2s}
.bnav button.on svg{opacity:0}
.bnav .lbl{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:11px;font-weight:600;color:#fff;opacity:0;transition:.25s}
.bnav button.on .lbl{opacity:1}
.bnav .bdg{position:absolute;top:12px;right:calc(50% - 24px);min-width:16px;height:16px;border-radius:8px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px;z-index:3}
.bnav .bdg.new{animation:badgeIn .55s cubic-bezier(.25,1.7,.5,1)}@keyframes badgeIn{0%{transform:scale(0);opacity:0}65%{transform:scale(1.45)}100%{transform:scale(1);opacity:1}}
.incoming{animation:receiveIn .58s cubic-bezier(.22,1.35,.45,1);border-color:rgba(45,224,176,.72)!important;box-shadow:0 0 0 1px rgba(45,224,176,.25),0 14px 34px rgba(45,224,176,.12)}@keyframes receiveIn{0%{opacity:0;transform:translateY(-20px) scale(.96)}65%{transform:translateY(3px) scale(1.01)}100%{opacity:1;transform:none}}
.receive-signal{width:10px;height:10px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 0 rgba(45,224,176,.7);display:inline-block;margin-right:7px;animation:receivePing 1.45s ease-out 2}@keyframes receivePing{70%{box-shadow:0 0 0 12px rgba(45,224,176,0);transform:scale(1.1)}100%{box-shadow:0 0 0 0 rgba(45,224,176,0);transform:scale(1)}}
.bump{position:absolute;top:-44px;left:calc((var(--ai) + .5) * 20% - 48px);width:96px;height:44px;transition:left .45s cubic-bezier(.4,1.4,.5,1);pointer-events:none}
.bump .bsvg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.bump .bsvg path{fill:var(--nav)}
.fab{position:absolute;left:20px;top:6px;width:56px;height:56px;border-radius:50%;background:#fff;color:#10141c;display:grid;place-items:center;box-shadow:0 6px 16px rgba(0,0,0,.45),0 0 0 4px rgba(150,160,170,.5)}
.fab svg{width:24px;height:24px}
.bnav button.on .bdg{top:-16px;right:calc(50% - 34px)}
@media(max-width:480px){.bnav{height:64px}.bnav button svg{width:21px;height:21px}.fab{width:50px;height:50px;left:23px;top:5px}.fab svg{width:21px;height:21px}.bnav .lbl{font-size:10px;bottom:7px}}
canvas#graph{width:100%;height:120px;display:block}
.log{font:12px ui-monospace,monospace;color:var(--mut);max-height:260px;overflow:auto}
.qrimg{width:170px;height:170px;background:#fff;border-radius:14px;padding:8px;image-rendering:pixelated;box-shadow:0 0 0 1px var(--ln),0 0 30px rgba(45,224,176,.15)}
.switch{width:46px;height:26px;border-radius:13px;background:var(--ln);position:relative;transition:.2s;flex:none;cursor:pointer}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.switch.on{background:var(--mint)}.switch.on::after{left:23px}
.toast{position:fixed;top:52px;left:50%;transform:translateX(-50%);z-index:80;background:var(--p2);border:1px solid var(--ln);border-radius:12px;padding:10px 18px;font-weight:600;animation:mup .3s;max-width:92vw}
.toast.err{border-color:var(--red);color:var(--red)}
.flash{position:fixed;inset:0;z-index:90;display:grid;place-items:center;background:rgba(5,8,11,.55);backdrop-filter:blur(3px)}
.flash svg{width:110px;height:110px;stroke:var(--mint);stroke-width:3;fill:none;filter:drop-shadow(0 0 24px rgba(45,224,176,.8))}
.flash svg path{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .5s .05s forwards}
.flash svg circle{stroke:rgba(45,224,176,.35);stroke-dasharray:1;stroke-dashoffset:1;animation:draw .7s forwards}
#offline{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;text-align:center;padding:20px}
#offline h2{margin-bottom:10px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body data-tab="send">
<div id="errbar" class="hidden"></div>

function sha256blob(blob){
 if(!crypto.subtle)return Promise.resolve(null);
 return blob.arrayBuffer().then(function(buf){
  return crypto.subtle.digest("SHA-256",buf).then(function(h){
   return Array.prototype.map.call(new Uint8Array(h),function(b){return b.toString(16).padStart(2,"0")}).join("")});
 }).catch(function(){return null})}

 '<div class="devname">'+label+'</div><div class="tray" id="trR"></div></div></div>'+
 '<div class="netline"><div class="pulse"></div>'+
 '<span class="node" style="left:25%"></span><span class="node" style="left:50%"></span><span class="node" style="left:75%"></span>'+
 '<div class="netpkt" id="fxpkt"><div class="bx">'+count+'</div></div></div>'+
 '<div class="fxchk hidden" id="fxch"><svg viewBox="0 0 52 52"><path pathLength="1" d="M12 27l9 9 19-21"/></svg></div>'+
 '<div class="fxlabel" id="fxl">Упаковка…</div>';
 document.body.append(d);
 var pkt=$("#fxpkt"),landed=false,flying=false,started=false;
 function begin(){if(started)return;started=true;flying=true;if(onReady)onReady()}
 $("#fxx").onclick=function(){clearFx();begin()};
 var n=Math.min(count,6),i=0;
  (function packNext(){ if(i>=n){ fxT(function(){ var w=$("#wvL");if(w)w.classList.add("go");
   fxT(begin,500); },350); return }
  var tr=$("#trL");if(tr){tr.insertAdjacentHTML("beforeend",'<i class="pk"></i>');var el=tr.lastElementChild;if(el)el.classList.add("in")}
  i++;fxT(packNext,150)})();
 function setP(p){ if(landed||!flying)return; p=Math.min(1,Math.max(0,p));
  pkt.style.left=(p*100)+"%";
  var nodes=document.querySelectorAll("#sendfx .node");
  nodes.forEach(function(nd){var nl=parseFloat(nd.style.left)/100; nd.classList.toggle("on",p>=nl)});
  var l=$("#fxl");if(l)l.textContent="Передача по сети… "+Math.round(p*100)+"%"}
 function land(){ if(landed)return;landed=true;
  pkt.style.left="100%";
  document.querySelectorAll("#sendfx .node").forEach(function(nd){nd.classList.add("on")});
  var w=$("#wvR");if(w)w.classList.add("go");
  pkt.style.opacity="0";
  var l=$("#fxl");if(l)l.textContent="Доставлено";
  var c=$("#fxch");if(c)c.classList.remove("hidden");
  var tr=$("#trR"),k=0,m=Math.min(count,6);
  (function unNext(){if(k>=m)return;if(tr){tr.insertAdjacentHTML("beforeend","<i></i>");var el=tr.lastElementChild;if(el)el.classList.add("in")}k++;fxT(unNext,120)})();
  fxT(clearFx,3400)}
 FX={setP:setP,land:land};

function deckHTML(n){var h='<div class="deck" id="deck">';
 for(var i=0;i<n;i++){
  var a=(i-(n-1)/2)*9,d=(i-(n-1)/2)*11;
  h+='<div class="slot" data-fan="rotate('+a+'deg) translateX('+d+'px)" style="transform:none"><div class="cd"><span></span>'+
     '<svg viewBox="0 0 100 140" preserveAspectRatio="none"><rect x="1" y="1" width="98" height="138" rx="14" pathLength="1"/></svg></div></div>'}
 return h+"</div>"}
function slots(){return [].slice.call(document.querySelectorAll("#deck .slot"))}
function curTF(s){var t=getComputedStyle(s).transform;return (t&&t!=="none")?t:"matrix(1,0,0,1,0,0)"}
function rowIn(){slots().forEach(function(s,i){
 s.animate([{transform:"translateY(26px) scale(.6)",opacity:0},{transform:"none",opacity:1}],
 {duration:380,delay:i*70,easing:"cubic-bezier(.3,1.5,.5,1)",fill:"backwards"})})}
function fanOut(){slots().forEach(function(s,i){
 s.animate([{marginLeft:"5px",marginRight:"5px",transform:"none"},
            {marginLeft:"-8px",marginRight:"-8px",transform:s.dataset.fan}],
 {duration:560,delay:i*50,easing:"cubic-bezier(.3,1.4,.5,1)",fill:"forwards"})})}
function gatherUp(){var dk=$("#deck");if(!dk)return Promise.resolve();
 var W=dk.offsetWidth,Hh=dk.offsetHeight;
 var sl=slots();
 sl.forEach(function(s,i){
  var cur=curTF(s);
  var lx=s.offsetLeft+s.offsetWidth/2, ly=s.offsetTop+s.offsetHeight/2;
  var dx=W/2-lx, dy=Hh/2-ly;
  s.animate([{transform:cur},
             {transform:"translate("+dx+"px,"+dy+"px) scale("+(1-i*0.006)+")"}],
   {duration:430,delay:i*70,easing:"cubic-bezier(.3,1.25,.5,1)",fill:"forwards"})});
 return sleep(430+sl.length*70+220)}
function verifyUp(){var dk=$("#deck");if(!dk)return Promise.resolve();
 dk.classList.add("okk");
 dk.insertAdjacentHTML("beforeend",'<svg class="pilechk" viewBox="0 0 52 52"><path pathLength="1" d="M14 27l8 8 16-18"/></svg>');
 return sleep(950)}
function fanBack(){var sl=slots();sl.forEach(function(s,i){
 s.animate([{marginLeft:"-8px",marginRight:"-8px",transform:s.dataset.fan}],
 {duration:320,delay:(sl.length-1-i)*40,easing:"cubic-bezier(.3,1.3,.5,1)",fill:"forwards"})})}
function openDeck(o){$("#modals").innerHTML='<div class="mback"><div class="modal wide" id="dmodal"><h3>'+o.title+'</h3>'+
 '<p class="sub mut" id="dsub">'+o.sub+'</p><div class="deckwrap">'+deckHTML(o.len)+'</div>'+
 '<p class="sm mut" style="text-align:center">Ввод · вставка · Enter</p>'+
 '<div class="row" style="justify-content:center;margin-top:14px"><button class="btn" id="dc">Отмена</button></div></div></div>';
 rowIn();setTimeout(fanOut,450);
 var inp=document.createElement("input");inp.inputMode="numeric";inp.autocomplete="one-time-code";
 inp.style.cssText="position:fixed;opacity:0;top:0;left:0";document.body.append(inp);
 setTimeout(function(){try{inp.focus({preventScroll:true})}catch(e){inp.focus()}},100);
 var val="",busy=false;
 function paint(){slots().forEach(function(s,i){var sp=s.querySelector("span");
  if((val[i]||"")!==sp.textContent){sp.textContent=val[i]||"";
   if(val[i])sp.animate([{transform:"scale(.4)",opacity:0},{transform:"scale(1)",opacity:1}],{duration:200,easing:"ease-out"})}
  s.classList.toggle("cur",i===val.length)})}
 paint();
 inp.oninput=function(){val=inp.value.replace(/\D/g,"").slice(0,o.len);inp.value=val;paint();if(val.length===o.len)done()};
 inp.onkeydown=function(e){if(e.key==="Enter"&&val.length===o.len)done();
  if(e.key==="Backspace"){val=val.slice(0,-1);inp.value=val;paint()}};
 function done(){if(busy)return;busy=true;var ok=true;
  var apiP=o.onDone(val).catch(function(){ok=false});
  Promise.all([apiP,sleep(200)]).then(function(){
   var deck=$("#deck");if(!deck){close();return}
   var confId=ok&&o.confirmId?o.confirmId():null;
   if(ok){
    gatherUp().then(verifyUp).then(function(){
     var m=$("#dmodal");if(m)m.classList.add("ok");
     var h3=m?m.querySelector("h3"):null;if(h3)h3.textContent="Подтверждено";
     var sub=$("#dsub");if(sub)sub.textContent=confId?"Подтвердите сопряжение":"Настройка сессии…";
     var old=m.querySelector("#dc");if(old&&old.parentNode)old.parentNode.remove();
     var hint=m.querySelector(".sm.mut");if(hint)hint.style.display="none";
     var row=document.createElement("div");row.className="row";row.style.justifyContent="center";row.style.marginTop="4px";
     if(confId){
      row.innerHTML='<button class="btn mint" id="cfOk">Подтвердить</button><button class="btn red" id="cfNo">Отклонить</button>';
      m.append(row);
      $("#cfOk").onclick=function(){flash();api("pair-request/confirm",{id:confId}).then(function(){toast("Пара создана");close();poll()})};
      $("#cfNo").onclick=function(){api("pair-request/decline",{id:confId}).then(function(){close();poll()})};
     }else{
      row.innerHTML='<button class="btn" id="cfCl">Закрыть</button>';
      m.append(row);
      $("#cfCl").onclick=close;
      setTimeout(close,2000);
     }
    });
   }else{
    deck.classList.add("err");
    setTimeout(function(){var d2=$("#deck");if(d2)d2.classList.remove("err");
     fanBack();val="";inp.value="";paint();busy=false},550);
   }})}

 $("#dc").onclick=close}

function addFiles(list,cx,cy){[].slice.call(list).forEach(function(f){
 var it={uid:"u"+Math.random().toString(36).slice(2,8),file:f,name:f.name,size:f.size,
  url:f.type&&f.type.indexOf("image/")===0?URL.createObjectURL(f):null,sha:""};
 sha256blob(f).then(function(h){it.sha=h||""});
 staged.push(it);fileByUid[it.uid]=it;
 requestAnimationFrame(function(){var el=$("#fr_"+it.uid);if(!el)return;var r=el.getBoundingClientRect();
  var fx=(cx||r.left)-r.left,fy=(cy||r.top)-r.top;
  el.animate([{transform:"translate("+fx+"px,"+fy+"px) scale(.85)",opacity:.2},{transform:"none",opacity:1}],
   {duration:520,easing:"cubic-bezier(.3,1.4,.4,1)"})})});
 render()}
function transferCard(pid,label){$("#activeSends").insertAdjacentHTML("afterbegin",
 '<div class="card" id="tc_'+pid+'"><h3>Передача → '+label+'</h3><div class="drop" id="dp_'+pid+'">'+
 '<div class="waitring hidden" id="wr_'+pid+'"></div>'+
 '<div class="rig hidden" id="rg_'+pid+'"><svg viewBox="0 0 64 64" fill="none" stroke="#2de0b0" stroke-width="2.5" stroke-linecap="round">'+
 '<path d="M12 22a20 20 0 0 1 40 0Z"/><path d="M12 22l14 14M52 22 38 36M32 22v14"/><rect x="26" y="36" width="12" height="12" rx="3"/></svg></div>'+
 '<div class="track"><i id="tr_'+pid+'"></i></div><div class="pct" id="pc_'+pid+'"></div></div>'+
 '<div class="row" style="justify-content:center"><button class="btn sm red hidden" id="cx_'+pid+'">Отменить</button></div></div>')}
function setStage(pid,st,txt){var wr=$("#wr_"+pid),rg=$("#rg_"+pid),pc=$("#pc_"+pid);if(!wr)return;
 wr.classList.toggle("hidden",st!=="wait");rg.classList.toggle("hidden",st!=="fly");
 if(st==="wait")pc.textContent=txt||"ожидание подтверждения…";
 if(st==="done"){rg.classList.add("hidden");
  $("#dp_"+pid).insertAdjacentHTML("afterbegin",'<svg class="chk" viewBox="0 0 52 52"><path pathLength="1" d="M12 27l9 9 19-21"/></svg>');
  $("#tr_"+pid).style.width="100%";pc.textContent="Complete · 100%"}
 if(st==="bad"){rg.classList.add("hidden");wr.classList.remove("hidden");pc.textContent=txt||"отклонено/отменено"}}
function startSend(){var go=$("#go");go.disabled=true;
 var sel=$("#tgt").value.split(":");var tt=sel[0],tid=sel[1];
 var label=$("#tgt").selectedOptions[0].text;
 api("package/create",{target_type:tt,target_id:tid,files:staged.map(function(f){return {id:f.uid,name:f.name,size:f.size,sha256:f.sha||""}})})
 .then(function(r){
  if(!r.ok){toast("Ошибка пакета: "+(r.error||""),1);go.disabled=false;return}
  var pid=r.package.id;var items=staged.splice(0,staged.length);
  items.forEach(function(it){pkgOf[it.uid]=pid});
  render();transferCard(pid,label);
  setStage(pid,"wait","запрос отправлен — ждём подтверждения получателя");
  var cx=$("#cx_"+pid);cx.classList.remove("hidden");cx.onclick=function(){api("package/cancel",{id:pid})};
  var waitP=new Promise(function(res){waiters[pid]=res});
  waitP.then(function(status){
   cx.classList.add("hidden");
   if(status!=="accepted"&&status!=="transferring"){setStage(pid,"bad");toast("Пакет отклонён",1);return}
   var pkg=(S?S.packages||[]:[]).find(function(x){return x.id===pid});
   var pend=pkg?items.filter(function(it){var f=null;
    pkg.files.forEach(function(x){if(x.id===it.uid)f=x});return f&&f.status==="pending"}):items;
   if(!pend.length){setStage(pid,"bad","все файлы отклонены");toast("Получатель отклонил все файлы",1);return}
   setStage(pid,"fly");
   showSendFX(pend.length,label,function(){
    var totalB=0;pend.forEach(function(f){totalB+=f.size||0});
    var loaded={};
    window._fxprog=function(uid,p){loaded[uid]=p;var sum=0;
     pend.forEach(function(f){sum+=(loaded[f.uid]||0)*(f.size||0)});
     if(FX)FX.setP(totalB?sum/totalB:p)};
    var chain=Promise.resolve();
    pend.forEach(function(f){chain=chain.then(function(){return uploadFile(pid,f)})});
    chain.then(function(){if(FX)FX.land();setStage(pid,"done");flash();toast("Передача завершена");poll()})
    .catch(function(){setStage(pid,"bad","сервер отклонил файл или соединение прервано");toast("Передача не завершена",1);poll()})});
  })})}
function progUI(f,p,pid){var el=$("#fr_"+f.uid);if(el){el.style.setProperty("--p",p);var fs=$("#fs_"+f.uid);
 if(fs)fs.textContent=fmt(f.size*p)+" / "+fmt(f.size)+" · "+Math.round(p*100)+"%"}
 var tr=$("#tr_"+pid);if(tr)tr.style.width=Math.round(p*100)+"%";
 var pc=$("#pc_"+pid);if(pc)pc.textContent=Math.round(p*100)+"%"}
function uploadFile(pid,f){return new Promise(function(res,rej){
 var rate=getRate();
 if(!rate){
  var x=new XMLHttpRequest();
  x.open("POST","/api/upload?package_id="+pid+"&file_id="+f.uid+"&client="+enc(myId||""));
  if(authToken)x.setRequestHeader("X-BanTV-Token",authToken);
  x.upload.onprogress=function(e){var p=e.total?e.loaded/e.total:0;
   if(window._fxprog)window._fxprog(f.uid,p);progUI(f,p,pid)};
  x.onload=function(){if(x.status>=200&&x.status<300){if(window._fxprog)window._fxprog(f.uid,1);doneUI(f);res()}
   else{failUI(f);rej(new Error("HTTP "+x.status))}};
  x.onerror=function(){failUI(f);rej(new Error("network"))};
  x.send(f.file);
  return}
 var CHUNK=262144,off=0;
 function step(){
  var blob=f.file.slice(off,off+CHUNK);
  var isFinal=(off+blob.size)>=f.size;
  var t0=performance.now();
  var x=new XMLHttpRequest();
  x.open("POST","/api/upload?package_id="+pid+"&file_id="+f.uid+"&offset="+off+"&client="+enc(myId||"")+(isFinal?"&final=1":""));
  if(authToken)x.setRequestHeader("X-BanTV-Token",authToken);
  x.onload=function(){if(!(x.status>=200&&x.status<300)){failUI(f);rej(new Error("HTTP "+x.status));return}off+=blob.size;
   if(window._fxprog)window._fxprog(f.uid,f.size?off/f.size:1);
   progUI(f,f.size?off/f.size:1,pid);
   if(isFinal){doneUI(f);res();return}
   var dt=(performance.now()-t0)/1000;
   var want=blob.size/rate;
   setTimeout(step,Math.max(0,(want-dt))*1000)};
  x.onerror=function(){failUI(f);rej(new Error("network"))};
  x.send(blob)}
 step()})}
function doneUI(f){var el=$("#fr_"+f.uid);if(el){el.classList.remove("fail");el.classList.add("done");el.style.setProperty("--p",1);
 var rb=el.querySelector("[data-retry]");if(rb)rb.remove();
 if(!el.querySelector(".okb"))el.insertAdjacentHTML("beforeend",'<span class="okb"><svg viewBox="0 0 24 24" fill="none" stroke="#04241b" stroke-width="3"><path d="m5 13 5 5L20 7"/></svg></span>');
 var fs=$("#fs_"+f.uid);if(fs)fs.textContent=fmt(f.size)+" · uploaded"}}
function failUI(f){var el=$("#fr_"+f.uid);if(el){el.classList.add("fail");
 var fs=$("#fs_"+f.uid);if(fs)fs.textContent=fmt(f.size)+" · upload failed";
 if(!el.querySelector("[data-retry]"))el.insertAdjacentHTML("beforeend",'<button class="btn sm" data-retry="'+f.uid+'" title="Повторить">↻</button>')}}
function download(fid,name,btn,sha){
 var old=btn?btn.innerHTML:"⬇";if(btn)btn.disabled=true;
 var headers={};if(authToken)headers["X-BanTV-Token"]=authToken;
 fetch("/api/download/"+enc(fid)+"?client="+enc(myId||""),{headers:headers}).then(function(r){
  if(!r.ok)throw new Error("HTTP "+r.status);
  var total=+r.headers.get("Content-Length")||0,rd=r.body.getReader(),ch=[],got=0;
  function step(){return rd.read().then(function(o){if(o.done)return ch;
   ch.push(o.value);got+=o.value.length;
   if(btn)btn.innerHTML=total?Math.round(got/total*100)+"%":"…";return step()})}
  return step().then(function(c){var b=new Blob(ch);
   return sha256blob(b).then(function(got_sha){
    if(sha&&got_sha&&got_sha!==sha.toLowerCase())toast("⚠ Файл повреждён (несовпадение SHA‑256)",1);
    var a=document.createElement("a"),u=URL.createObjectURL(b);a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},1000);
    if(btn){btn.innerHTML="✓";flash();setTimeout(function(){btn.innerHTML=old;btn.disabled=false},1100)}})})})
 .catch(function(){if(btn){btn.innerHTML=old;btn.disabled=false}toast("Ошибка загрузки",1)})}
function poll(){var headers={};if(authToken)headers["X-BanTV-Token"]=authToken;
 return fetch("/api/state?client="+enc(myId||""),{headers:headers}).then(function(r){return r.json()}).then(function(st){
 S=st;
 if(OFF){OFF=false;$("#offline").classList.add("hidden")}
 if(local&&S.self&&!myId){myId=S.self.id;isHost=true;myName=S.self.name}
 var u=$("#tbUrl");if(u)u.textContent=(S.server.url||"").replace("http://","");
 var me=myId,offers=(S.packages||[]).filter(function(p){return p.status==="offering"&&p.sender_id!==me});
 freshOffers={};offers.forEach(function(p){if(seenOffers[p.id])return;freshOffers[p.id]=true;seenOffers[p.id]=1});
 badge("recv",offers.length);
 badge("links",(S.pair_requests||[]).filter(function(x){return x.to===me||x.from===me}).length);

 document.querySelectorAll("[data-exp]").forEach(function(el){var t=+el.dataset.exp-S.now;
  el.textContent=t<=0?"сейчас":Math.ceil(t)+" с"});
 (S.packages||[]).forEach(function(p){var w=waiters[p.id];if(w&&p.status!=="offering"){delete waiters[p.id];w(p.status)}});
 (S.pair_requests||[]).forEach(function(r){if((r.to===me||r.from===me)&&!shownReq[r.id]){shownReq[r.id]=1;
  if(!DESKTOP()){openPairModal(r,me)} else {toast("🔗 Запрос сопряжения — раздел «Связи»")}}});
 if(!isHost&&localStorage.getItem("bantv_auto"))
  (S.packages||[]).filter(function(p){return p.status==="offering"&&p.sender_id!==me})
  .forEach(function(p){api("package/accept",{id:p.id,files:p.files.map(function(f){return f.id})})});
 var sig=JSON.stringify([TAB,
  (S.packages||[]).map(function(p){return [p.id,p.status,p.progress||0,p.files.map(function(f){return f.status})]}),
  (S.devices||[]).map(function(d){return [d.id,d.name,d.online]}),
  (S.pair_requests||[]).map(function(x){return x.id}),
  (S.pair_invites||[]).map(function(x){return x.id}),(S.group_invites||[]).map(function(x){return x.id}),
  S.pairs,S.groups,S.files,S.logs.length,S.settings.auto_accept,S.settings.speed_limit,
  S.pairing&&S.pairing.active?S.pairing.code:null]);
 if(sig!==SIG){SIG=sig;render()}
}).catch(function(){if(!OFF&&location.protocol!=="file:"){OFF=true;$("#offline").classList.remove("hidden")}})}

setInterval(poll,1200);

try{navHTML();render();poll();}
catch(e){var v=$("#view");if(v)v.innerHTML='<div class="card">Ошибка запуска: '+e.message+"</div>"}

if(pcode)setTimeout(function(){
